services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: fachberater-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../config:/app/config:ro
    depends_on:
      mongodb:
        condition: service_started
    environment:
      NODE_ENV: production

  mongodb:
    image: mongo:8
    container_name: fachberater-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
